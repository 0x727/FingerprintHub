id: openpanel
info:
  name: openpanel
  author: cn-kali-team
  tags: detect,tech,openpanel
  severity: info
  metadata:
    fofa-query:
    - title="bull dashboard"
    product: openpanel
    shodan-query:
    - title:"bull dashboard"
    vendor: openpanel
    verified: true
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  matchers:
  - type: regex
    regex:
    - (?mi)<title[^>]*>bull dashboard.*?</title>
