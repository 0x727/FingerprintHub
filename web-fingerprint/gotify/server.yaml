id: server
info:
  name: server
  author: cn-kali-team
  tags: detect,tech,server
  severity: info
  metadata:
    fofa-query:
    - title="gotify"
    product: server
    shodan-query:
    - http.title:"gotify"
    vendor: gotify
    verified: true
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  matchers:
  - type: regex
    regex:
    - (?mi)<title[^>]*>gotify.*?</title>
