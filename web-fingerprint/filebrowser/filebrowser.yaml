id: filebrowser
info:
  name: filebrowser
  author: cn-kali-team
  tags: detect,tech,filebrowser
  severity: info
  metadata:
    fofa-query:
    - title="file browser"
    product: filebrowser
    shodan-query:
    - http.title:"file browser"
    vendor: filebrowser
    verified: true
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  matchers:
  - type: regex
    regex:
    - (?mi)<title[^>]*>file browser.*?</title>
