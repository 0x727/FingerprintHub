id: nuxt
info:
  name: nuxt
  author: cn-kali-team
  tags: detect,tech,nuxt
  severity: info
  metadata:
    fofa-query:
    - body="__nuxt"
    product: nuxt
    shodan-query:
    - html:"__nuxt"
