id: audiobookshelf
info:
  name: audiobookshelf
  author: cn-kali-team
  tags: detect,tech,audiobookshelf
  severity: info
  metadata:
    fofa-query:
    - title="audiobookshelf"
    product: audiobookshelf
    shodan-query:
    - title:"audiobookshelf"
    vendor: audiobookshelf
    verified: true
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  matchers:
  - type: regex
    regex:
    - (?mi)<title[^>]*>audiobookshelf.*?</title>
