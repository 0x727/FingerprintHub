id: stirling-pdf
info:
  name: stirling-pdf
  author: cn-kali-team
  tags: detect,tech,stirling-pdf
  severity: info
  metadata:
    fofa-query:
    - title="stirling pdf"
    product: stirling-pdf
    shodan-query:
    - http.title:"stirling pdf"
    vendor: stirling-tools
    verified: true
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  matchers:
  - type: regex
    regex:
    - (?mi)<title[^>]*>stirling pdf.*?</title>
