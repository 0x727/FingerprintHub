id: etherpad
info:
  name: etherpad
  author: cn-kali-team
  tags: detect,tech,etherpad
  severity: info
  metadata:
    fofa-query:
    - title="etherpad"
    product: etherpad
    shodan-query:
    - http.title:"etherpad"
    vendor: ether
    verified: true
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  matchers:
  - type: regex
    regex:
    - (?mi)<title[^>]*>etherpad.*?</title>
