id: rustypaste
info:
  name: rustypaste
  author: cn-kali-team
  tags: detect,tech,rustypaste
  severity: info
  metadata:
    product: rustypaste
    shodan-query:
    - title:"rustypaste"
    vendor: orhun
    verified: true
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  matchers:
  - type: regex
    regex:
    - (?mi)<title[^>]*>rustypaste.*?</title>
