id: mineadmin
info:
  name: mineadmin
  author: cn-kali-team
  tags: detect,tech,mineadmin
  severity: info
  metadata:
    fofa-query:
    - body="mineadmin"
    product: mineadmin
    shodan-query:
    - http.html:"mineadmin"
