id: docmost
info:
  name: docmost
  author: cn-kali-team
  tags: detect,tech,docmost
  severity: info
  metadata:
    fofa-query:
    - title="docmost"
    product: docmost
    shodan-query:
    - http.title:"docmost"
    vendor: docmost
    verified: true
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  matchers:
  - type: regex
    regex:
    - (?mi)<title[^>]*>docmost.*?</title>
