id: openchamber
info:
  name: openchamber
  author: cn-kali-team
  tags: detect,tech,openchamber
  severity: info
  metadata:
    fofa-query:
    - title="openchamber"
    product: openchamber
    shodan-query:
    - http.title:"openchamber"
    vendor: openchamber
    verified: true
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  matchers:
  - type: regex
    regex:
    - (?mi)<title[^>]*>openchamber.*?</title>
