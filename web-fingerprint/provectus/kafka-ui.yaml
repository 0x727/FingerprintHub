id: kafka-ui
info:
  name: kafka-ui
  author: cn-kali-team
  tags: detect,tech,kafka-ui
  severity: info
  metadata:
    fofa-query:
    - title="ui for apache kafka"
    product: kafka-ui
    shodan-query:
    - http.title:"ui for apache kafka"
    vendor: provectus
    verified: true
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  matchers:
  - type: regex
    regex:
    - (?mi)<title[^>]*>ui for apache kafka.*?</title>
