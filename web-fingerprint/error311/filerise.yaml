id: filerise
info:
  name: filerise
  author: cn-kali-team
  tags: detect,tech,filerise
  severity: info
  metadata:
    fofa-query:
    - title="filerise"
    google-query:
    - intitle:"filerise"
    product: filerise
    shodan-query:
    - http.title:"filerise"
    vendor: error311
    verified: true
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  matchers:
  - type: regex
    regex:
    - (?mi)<title[^>]*>filerise.*?</title>
