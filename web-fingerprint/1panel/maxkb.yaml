id: maxkb
info:
  name: maxkb
  author: cn-kali-team
  tags: detect,tech,maxkb
  severity: info
  metadata:
    fofa-query:
    - title="maxkb"
    product: maxkb
    shodan-query:
    - http.title:"maxkb"
