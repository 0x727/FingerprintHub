id: core-geonetwork
info:
  name: core-geonetwork
  author: cn-kali-team
  tags: detect,tech,core-geonetwork
  severity: info
  metadata:
    product: core-geonetwork
    shodan-query:
    - html:"/srv/eng/"
    vendor: geonetwork
    verified: true
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  matchers:
  - type: word
    words:
    - /srv/eng/
